<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Subtitles</title>
<meta name="description" content="Live translated subtitles between English, German, Spanish, Catalan, Italian and French.">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subtitles">
<link rel="preconnect" href="https://translate.googleapis.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --line: #2a2f3a;
    --text: #f4f5f7;
    --muted: #9aa1ad;
    --interim: #8b919c;
    --accent: #ffd23f;
    --accent-ink: #1a1400;
    --danger: #ff6b6b;
    --sub-size: 34px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior: none;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 650; letter-spacing: .2px; }
  .icon-btn {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; height: 38px; min-width: 38px; padding: 0 10px; font-size: 15px; cursor: pointer;
  }
  .langs { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
  .pick { flex: 1; min-width: 0; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 7px; }
  .pick span { display: block; font-size: 12px; color: var(--muted); }
  .pick select {
    -webkit-appearance: none; appearance: none; width: 100%; background: none; border: 0; padding: 0;
    color: var(--accent); font-size: 17px; font-weight: 650; font-family: inherit; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 16px;
  }
  .pick::after { content: "⌄"; position: absolute; right: 10px; bottom: 9px; color: var(--muted); pointer-events: none; }
  #swap { height: 48px; min-width: 48px; border-radius: 12px; font-size: 20px; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 12px 16px; gap: 12px; }
  #stage {
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
    background: #000; border-radius: 16px; padding: 18px; border: 1px solid var(--line);
  }
  #stage .spacer { flex: 1; }
  .line { margin-top: 14px; }
  .line .en { font-size: var(--sub-size); line-height: 1.22; font-weight: 600; color: var(--text); word-wrap: break-word; }
  .line .orig { font-size: max(14px, calc(var(--sub-size) * .45)); color: var(--muted); margin-top: 4px; }
  .line.pending .en { color: var(--muted); font-weight: 500; }
  .line.old .en { opacity: .55; }
  .hide-orig .line .orig { display: none; }
  #interim { margin-top: 14px; min-height: 1.2em; }
  #interim .en { font-size: var(--sub-size); line-height: 1.22; font-weight: 600; color: #c9ced6; word-wrap: break-word; }
  #interim .orig { font-size: max(14px, calc(var(--sub-size) * .45)); color: var(--interim); font-style: italic; margin-top: 4px; }
  .hide-orig #interim .orig { display: none; }
  #placeholder { color: var(--muted); font-size: 18px; text-align: center; margin: auto 0; }

  #status { font-size: 14px; color: var(--muted); min-height: 20px; text-align: center; }
  #status.error { color: var(--danger); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); margin-right: 6px; vertical-align: 1px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .controls { display: flex; gap: 10px; align-items: center; }
  #toggle {
    flex: 1; height: 58px; border-radius: 16px; border: 0; font-size: 19px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  #toggle.on { background: var(--danger); color: #fff; }
  .size { display: flex; gap: 6px; }
  .size .icon-btn { height: 58px; min-width: 52px; border-radius: 16px; font-size: 18px; font-weight: 700; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 18px;
    width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dlg-head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
  .dlg-head h2 { margin: 0; font-size: 18px; flex: 1; }
  .dlg-body { padding: 16px; overflow-y: auto; max-height: calc(100dvh - 140px); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .field input[type=email] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px;
  }
  .field input[type=range] { width: 100%; }
  .check { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .check input { width: 22px; height: 22px; }
  #historyList { display: flex; flex-direction: column; gap: 12px; }
  #historyList .item { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  #historyList .item .t { color: var(--muted); font-size: 12px; }
  #historyList .item .en { font-size: 17px; }
  #historyList .item .orig { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; }
  .row .icon-btn { flex: 1; height: 44px; }
  .engine { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Live Subtitles</h1>
  <button class="icon-btn" id="historyBtn" aria-label="History">History</button>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
</header>

<div class="langs">
  <label class="pick"><span>From (spoken)</span><select id="fromSel" aria-label="Language being spoken"></select></label>
  <button class="icon-btn" id="swap" aria-label="Swap languages">⇄</button>
  <label class="pick"><span>To (subtitles)</span><select id="toSel" aria-label="Subtitle language"></select></label>
</div>

<main>
  <div id="stage" aria-live="polite">
    <div class="spacer"></div>
    <div id="placeholder">Pick the language being spoken and the language you want, then tap <b>Start listening</b>.</div>
    <div id="lines"></div>
    <div id="interim"><div class="en"></div><div class="orig"></div></div>
  </div>
  <div id="status"></div>
  <div class="controls">
    <button id="toggle">Start listening</button>
    <div class="size">
      <button class="icon-btn" id="clearScreen" aria-label="Erase the text on screen">⌫</button>
      <button class="icon-btn" id="smaller" aria-label="Smaller text">A−</button>
      <button class="icon-btn" id="bigger" aria-label="Bigger text">A+</button>
    </div>
  </div>
</main>

<dialog id="settings">
  <div class="dlg-head"><h2>Settings</h2><button class="icon-btn" data-close>Done</button></div>
  <div class="dlg-body">
    <div class="field">
      <label for="sizeRange">Subtitle size: <span id="sizeVal"></span>px</label>
      <input type="range" id="sizeRange" min="18" max="72" step="2">
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="showOrig"> Show the original words underneath</label>
    </div>
    <div class="field">
      <label for="email">Email for the free translator (optional)</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      <div class="hint">MyMemory allows about 5,000 characters a day without an email, and about 50,000 with one. The email is only sent to MyMemory and stays on this phone.</div>
    </div>
    <div class="field">
      <div class="engine" id="engineInfo"></div>
    </div>
  </div>
</dialog>

<dialog id="history">
  <div class="dlg-head"><h2>History</h2><button class="icon-btn" data-close>Done</button></div>
  <div class="dlg-body">
    <div class="row">
      <button class="icon-btn" id="copyEn">Copy translation</button>
      <button class="icon-btn" id="copyBoth">Copy both</button>
      <button class="icon-btn" id="clearHist">Clear</button>
    </div>
    <div id="historyList"></div>
  </div>
</dialog>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ls.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ls.' + k, JSON.stringify(v)); } catch {} }
  };

  // ---------- State ----------
  const LANGS = [
    { code: 'en', rec: 'en-US', name: 'English', native: 'English' },
    { code: 'fr', rec: 'fr-FR', name: 'French', native: 'Français' },
    { code: 'de', rec: 'de-DE', name: 'German', native: 'Deutsch' },
    { code: 'es', rec: 'es-ES', name: 'Spanish', native: 'Español' },
    { code: 'ca', rec: 'ca-ES', name: 'Catalan', native: 'Català' },
    { code: 'it', rec: 'it-IT', name: 'Italian', native: 'Italiano' },
  ];
  const recOf = (code) => LANGS.find(l => l.code === code).rec;
  let lang = store.get('lang', 'de-DE');           // speech recognition language
  if (!LANGS.some(l => l.rec === lang)) lang = 'de-DE';
  let target = store.get('target', 'en');           // subtitle language
  if (!LANGS.some(l => l.code === target)) target = 'en';
  let size = store.get('size', 34);
  let showOrig = store.get('showOrig', true);
  let email = store.get('email', '');
  let history = store.get('history', []);
  let listening = false;
  let recognition = null;
  let wakeLock = null;
  let restartTimer = null;
  let lastError = null;
  const translators = {}; // on-device translators by source language
  const MAX_LINES_ON_SCREEN = 30;
  const MAX_HISTORY = 500;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- UI helpers ----------
  const status = (msg, isError = false) => {
    const el = $('#status');
    el.className = isError ? 'error' : '';
    el.innerHTML = msg;
  };
  const applySize = () => {
    size = Math.max(18, Math.min(72, size));
    document.documentElement.style.setProperty('--sub-size', size + 'px');
    $('#sizeRange').value = size; $('#sizeVal').textContent = size;
    store.set('size', size);
  };
  const applyOrig = () => {
    $('#stage').classList.toggle('hide-orig', !showOrig);
    $('#showOrig').checked = showOrig;
    store.set('showOrig', showOrig);
  };
  const srcOf = (l) => l.slice(0, 2);
  const fill = (sel) => { sel.innerHTML = LANGS.map(l => '<option value="' + l.code + '">' + l.native + '</option>').join(''); };
  fill($('#fromSel')); fill($('#toSel'));
  const applyLang = () => {
    $('#fromSel').value = srcOf(lang);
    $('#toSel').value = target;
    store.set('lang', lang); store.set('target', target);
    updateEngineInfo();
  };
  const scrollDown = () => { const s = $('#stage'); s.scrollTop = s.scrollHeight; };

  // ---------- Translation ----------
  // Returns a ready on-device translator, or null. Never waits for a model
  // download: that happens in the background while MyMemory is used.
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  const pendingCreate = {};
  async function getOnDeviceTranslator(src, tgt) {
    if (!('Translator' in self)) return null;
    const k = src + '>' + tgt;
    if (translators[k] !== undefined) return translators[k];
    if (!pendingCreate[k]) {
      pendingCreate[k] = (async () => {
        try {
          const avail = await withTimeout(Translator.availability({ sourceLanguage: src, targetLanguage: tgt }), 3000);
          if (avail === 'unavailable') { translators[k] = null; return; }
          translators[k] = await Translator.create({ sourceLanguage: src, targetLanguage: tgt });
        } catch {
          // May need a user gesture to download the model; try again on next Start.
        } finally { delete pendingCreate[k]; }
      })();
    }
    try { await withTimeout(pendingCreate[k], 1500); } catch {}
    return translators[k] || null;
  }

  const cache = new Map();
  async function translate(text, src, tgt = target) {
    if (src === tgt) return { text, engine: 'none' };
    const key = src + '>' + tgt + '|' + text;
    if (cache.has(key)) return cache.get(key);
    const out = await translateUncached(text, src, tgt);
    cache.set(key, out);
    if (cache.size > 400) cache.delete(cache.keys().next().value);
    return out;
  }

  // Free web translators, tried in order. When one says "too many requests"
  // (or fails), it is skipped for a while, longer each time.
  class Busy extends Error {}
  const httpGet = async (url) => {
    let res;
    try { res = await withTimeout(fetch(url), 5000); } catch (e) { throw new Busy('network'); }
    if (res.status === 429 || res.status === 403 || res.status >= 500) throw new Busy('HTTP ' + res.status);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  };
  const providers = [
    { name: 'Google', fn: async (q, sl, tl) => {
      const d = await httpGet('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + sl + '&tl=' + tl + '&q=' + encodeURIComponent(q));
      return (d[0] || []).map(seg => seg[0]).join('');
    } },
    { name: 'Google (2)', fn: async (q, sl, tl) => {
      const d = await httpGet('https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=' + sl + '&tl=' + tl + '&q=' + encodeURIComponent(q));
      const first = Array.isArray(d) ? d[0] : null;
      return typeof first === 'string' ? first : Array.isArray(first) ? first[0] : '';
    } },
    { name: 'MyMemory', fn: (q, sl, tl) => translateMyMemory(q, sl, tl).then(r => r.text) },
  ].map(p => Object.assign(p, { blockedUntil: 0, backoff: 15000, lastError: '' }));
  const nextFreeAt = () => Math.min(...providers.map(p => p.blockedUntil));
  const allBlocked = () => nextFreeAt() > Date.now();

  async function translateUncached(text, src, tgt) {
    const t = await getOnDeviceTranslator(src, tgt);
    if (t) {
      try { return { text: await withTimeout(t.translate(text), 8000), engine: 'device' }; } catch {}
    }
    for (const p of providers) {
      if (Date.now() < p.blockedUntil) continue;
      try {
        const out = await p.fn(text, src, tgt);
        if (!out) throw new Busy('empty answer');
        p.backoff = 15000; p.lastError = '';
        return { text: out, engine: p.name };
      } catch (e) {
        p.lastError = e.message;
        p.blockedUntil = Date.now() + p.backoff;
        p.backoff = Math.min(p.backoff * 2, 5 * 60000);
      }
    }
    throw new Busy('All free translators are busy');
  }

  async function translateMyMemory(text, src, tgt) {
    const params = new URLSearchParams({ q: text, langpair: src + '|' + tgt });
    if (email) params.set('de', email);
    const data = await httpGet('https://api.mymemory.translated.net/get?' + params);
    const out = data && data.responseData && data.responseData.translatedText;
    if (data.quotaFinished || /MYMEMORY WARNING/i.test(out || '')) {
      throw new Busy('daily limit reached');
    }
    if (data.responseStatus && Number(data.responseStatus) !== 200) throw new Error(out || 'Translation failed');
    return { text: decodeEntities(out || ''), engine: 'mymemory' };
  }

  function decodeEntities(s) {
    const ta = document.createElement('textarea'); ta.innerHTML = s; return ta.value;
  }

  async function updateEngineInfo() {
    const src = srcOf(lang);
    let msg = 'Translation: free Google web translator, with MyMemory as a backup (needs internet).';
    if ('Translator' in self) {
      try {
        const a = await withTimeout(Translator.availability({ sourceLanguage: src, targetLanguage: target }), 3000);
        if (a !== 'unavailable') msg = 'Translation: on this device' + (a === 'available' ? '' : ' (the model downloads the first time)') + '.';
      } catch {}
    }
    const errs = providers.filter(p => p.lastError).map(p => p.name + ': ' + p.lastError).join('; ');
    $('#engineInfo').textContent = 'App version 6. ' + msg + (errs ? ' Last problems: ' + errs + '.' : '') + (SR ? '' : ' Speech recognition is not supported in this browser.');
  }

  // ---------- Live (interim) translation ----------
  // Translates the words still being spoken, a few times a second, so English
  // appears before the sentence ends. Only the newest result is shown.
  let interimText = '', interimEn = '', interimSeq = 0, shownSeq = 0, resetSeq = 0;
  let finalsPending = 0, inFlight = 0, interimTimer = null, lastInterimAt = 0, lastSentText = '';
  const INTERIM_GAP_MS = 600, MAX_IN_FLIGHT = 1;
  function setInterim(text) {
    interimText = text;
    $('#interim .orig').textContent = text;
    if (!text) { interimEn = ''; $('#interim .en').textContent = ''; resetSeq = shownSeq = ++interimSeq; lastSentText = ''; return; }
    $('#placeholder').style.display = 'none';
    pumpInterim();
    scrollDown();
  }
  function pumpInterim() {
    clearTimeout(interimTimer);
    if (!interimText || interimText === lastSentText || inFlight >= MAX_IN_FLIGHT) return;
    // Finished sentences go first, and nothing live is sent while translators are resting.
    if (finalsPending > 0 || allBlocked()) { interimTimer = setTimeout(pumpInterim, 400); return; }
    const wait = INTERIM_GAP_MS - (Date.now() - lastInterimAt);
    if (wait > 0) { interimTimer = setTimeout(pumpInterim, wait); return; }
    const text = interimText, seq = ++interimSeq, src = srcOf(lang);
    inFlight++; lastInterimAt = Date.now(); lastSentText = text;
    translate(text, src).then(({ text: en }) => {
      // Show it only if nothing newer is on screen and the line wasn't reset meanwhile.
      if (seq > shownSeq && seq > resetSeq && interimText) {
        shownSeq = seq; interimEn = en; $('#interim .en').textContent = en; scrollDown();
      }
    }).catch(() => {}).finally(() => { inFlight--; pumpInterim(); });
  }

  // Long speech without a pause: the phone may not finish a "sentence" for a
  // long time. Every CHUNK_WORDS words, lock in the older words as a subtitle
  // line, keeping the last few words open because recognition still revises them.
  const CHUNK_WORDS = 12, KEEP_OPEN = 4;
  let committedWords = 0, fullInterim = '';
  const words = (t) => t.trim().split(/\s+/).filter(Boolean);

  // ---------- Subtitles ----------
  // Lines are translated in parallel but kept in spoken order.
  function addFinal(original) {
    original = original.trim();
    if (!original) return;
    $('#placeholder').style.display = 'none';
    const src = srcOf(lang), tgt = target;
    const el = document.createElement('div');
    el.className = 'line pending';
    el.innerHTML = '<div class="en"></div><div class="orig"></div>';
    el.querySelector('.en').textContent = interimEn || '…';
    el.querySelector('.orig').textContent = original;
    $('#lines').appendChild(el);
    trimLines();
    scrollDown();

    translateLine(el, original, src, tgt, 0);
  }

  function translateLine(el, original, src, tgt, attempt) {
    finalsPending++;
    translate(original, src, tgt).then(({ text }) => {
      el.classList.remove('pending');
      el.querySelector('.en').textContent = text || original;
      history.push({ t: Date.now(), lang: src, to: tgt, orig: original, en: text });
      if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
      store.set('history', history);
      if ($('#status').classList.contains('error') && listening) status('<span class="dot"></span>Listening in ' + langName() + '…');
      scrollDown();
    }).catch(err => {
      if (attempt < 8 && el.isConnected) {
        // Wait until a translator is free again, then retry this line.
        const wait = Math.max(2000, nextFreeAt() - Date.now() + 200);
        status('Translator is busy, retrying in ' + Math.ceil(wait / 1000) + ' s…', true);
        el.querySelector('.en').textContent = '… ' + original;
        setTimeout(() => translateLine(el, original, src, tgt, attempt + 1), wait);
      } else {
        el.classList.remove('pending');
        el.querySelector('.en').textContent = '[not translated] ' + original;
        status('Could not translate. Check your internet connection.', true);
      }
    }).finally(() => { finalsPending--; });
  }

  function trimLines() {
    const lines = $('#lines').children;
    while (lines.length > MAX_LINES_ON_SCREEN) lines[0].remove();
    [...lines].forEach((l, i) => l.classList.toggle('old', i < lines.length - 2));
  }

  // ---------- Speech recognition ----------
  function buildRecognition() {
    const r = new SR();
    r.lang = lang;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => { lastError = null; status('<span class="dot"></span>Listening in ' + langName() + '…'); };
    r.onresult = (e) => {
      let interim = '', hadFinal = false;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          // Skip the words already shown as chunks.
          const rest = words(res[0].transcript).slice(committedWords).join(' ');
          committedWords = 0;
          if (rest) addFinal(rest);
          hadFinal = true;
        } else interim += res[0].transcript;
      }
      if (hadFinal) setInterim('');
      fullInterim = interim;
      let w = words(interim);
      if (w.length - committedWords >= CHUNK_WORDS + KEEP_OPEN) {
        const upto = w.length - KEEP_OPEN;
        setInterim('');
        addFinal(w.slice(committedWords, upto).join(' '));
        committedWords = upto;
      }
      setInterim(w.slice(committedWords).join(' '));
    };
    r.onerror = (e) => {
      lastError = e.error;
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        stop();
        status('Microphone access was blocked. Allow it for this site in your browser settings, then try again.', true);
      } else if (e.error === 'language-not-supported') {
        stop();
        status(langName() + ' speech recognition is not available on this phone. Turn it on for dictation or voice typing in your keyboard settings.', true);
      } else if (e.error === 'network') {
        status('No connection to the speech service. Retrying…', true);
      } else {
        status('Speech error: ' + e.error, true);
      }
    };
    r.onend = () => {
      // Some phones stop without finishing the last sentence: keep it.
      if (interimText) addFinal(interimText);
      committedWords = 0;
      setInterim('');
      // Browsers stop after silence or a time limit, so keep restarting while listening.
      if (listening) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          if (!listening) return;
          try { recognition.start(); } catch { recognition = buildRecognition(); try { recognition.start(); } catch {} }
        }, lastError === 'network' ? 1500 : 250);
      }
    };
    return r;
  }

  const langName = () => LANGS.find(l => l.code === srcOf(lang)).name;

  async function start() {
    if (!SR) {
      status('This browser can\'t do speech recognition. Use Chrome on Android or Safari on iPhone.', true);
      return;
    }
    if (!window.isSecureContext) {
      status('The microphone needs HTTPS. Open the app from its https:// address.', true);
      return;
    }
    listening = true;
    $('#toggle').textContent = 'Stop';
    $('#toggle').classList.add('on');
    // Warm up the on-device translator during the user gesture so its model can download.
    if (srcOf(lang) !== target) getOnDeviceTranslator(srcOf(lang), target);
    recognition = buildRecognition();
    try { recognition.start(); } catch (e) { status('Could not start: ' + e.message, true); stop(); return; }
    requestWakeLock();
  }

  function stop() {
    listening = false;
    committedWords = 0;
    clearTimeout(restartTimer);
    $('#toggle').textContent = 'Start listening';
    $('#toggle').classList.remove('on');
    setInterim('');
    if (recognition) { try { recognition.onend = null; recognition.stop(); } catch {} recognition = null; }
    releaseWakeLock();
    if (!$('#status').classList.contains('error')) status('');
  }

  // ---------- Screen wake lock ----------
  async function requestWakeLock() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch {}
  }
  function releaseWakeLock() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && listening) requestWakeLock();
  });

  // ---------- History ----------
  function renderHistory() {
    const list = $('#historyList');
    list.innerHTML = '';
    if (!history.length) { list.innerHTML = '<div class="engine">Nothing yet. Subtitles you see are saved here on this phone.</div>'; return; }
    [...history].reverse().forEach(h => {
      const d = document.createElement('div'); d.className = 'item';
      const time = new Date(h.t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      d.innerHTML = '<div class="t"></div><div class="en"></div><div class="orig"></div>';
      d.querySelector('.t').textContent = time + ' · ' + h.lang.toUpperCase() + ' → ' + (h.to || 'en').toUpperCase();
      d.querySelector('.en').textContent = h.en;
      d.querySelector('.orig').textContent = h.orig;
      list.appendChild(d);
    });
  }
  async function copyText(text, btn) {
    const label = btn.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    btn.textContent = 'Copied'; setTimeout(() => btn.textContent = label, 1200);
  }

  // ---------- Wire up ----------
  const changeLangs = (from, to) => {
    const restart = listening && recOf(from) !== lang;
    lang = recOf(from); target = to;
    applyLang();
    setInterim(''); // the open line was translated for the old pair
    if (restart) { stop(); start(); }
  };
  $('#fromSel').addEventListener('change', (e) => changeLangs(e.target.value, target));
  $('#toSel').addEventListener('change', (e) => changeLangs(srcOf(lang), e.target.value));
  $('#swap').addEventListener('click', () => changeLangs(target, srcOf(lang)));
  $('#toggle').addEventListener('click', () => listening ? stop() : (status(''), start()));
  // Erase the subtitles on screen (History keeps them).
  $('#clearScreen').addEventListener('click', () => {
    $('#lines').innerHTML = '';
    // Words already heard stay erased even when the phone finishes the sentence.
    committedWords = listening ? words(fullInterim).length : 0;
    setInterim('');
    $('#placeholder').style.display = listening ? 'none' : '';
  });
  $('#smaller').addEventListener('click', () => { size -= 4; applySize(); });
  $('#bigger').addEventListener('click', () => { size += 4; applySize(); });
  $('#sizeRange').addEventListener('input', (e) => { size = Number(e.target.value); applySize(); });
  $('#showOrig').addEventListener('change', (e) => { showOrig = e.target.checked; applyOrig(); });
  $('#email').value = email;
  $('#email').addEventListener('change', (e) => { email = e.target.value.trim(); store.set('email', email); });
  $('#settingsBtn').addEventListener('click', () => { updateEngineInfo(); $('#settings').showModal(); });
  $('#historyBtn').addEventListener('click', () => { renderHistory(); $('#history').showModal(); });
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));
  $('#copyEn').addEventListener('click', (e) => copyText(history.map(h => h.en).join('\n'), e.currentTarget));
  $('#copyBoth').addEventListener('click', (e) => copyText(history.map(h => h.orig + '\n' + h.en).join('\n\n'), e.currentTarget));
  $('#clearHist').addEventListener('click', () => { history = []; store.set('history', history); renderHistory(); });

  applySize(); applyOrig(); applyLang();
  if (!SR) status('This browser can\'t do speech recognition. Use Chrome on Android or Safari on iPhone.', true);
})();
</script>
</body>
</html>
